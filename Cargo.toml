[package]
name = "OxideGram"
version = "1.3.0"
edition = "2024"

[dependencies]
mlua = { version = "0.12.0", features = ["lua54", "vendored", "async", "send"] }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-tl-types = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", features = ["markdown", "html"] }
grammers-crypto = { git = "https://codeberg.org/Lonami/grammers.git" }
notify = "8.0"
# Pinned to 2.0.0-rc0 due to breaking changes in glass_pumpkin 2.0.0-rc1 breaking grammers-crypto
glass_pumpkin = "=2.0.0-rc0"
aes-gcm = { version = "0.11.0", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = { version = "0.10.2", features = ["sys_rng"] }
tokio = { version = "1.53.1", features = ["full"] }
argon2 = { version = "0.5.3", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
async-trait = "0.1.91"
thiserror = "2.0.19"
tracing = "0.1.44"
inquire = "0.9.4"
toml = "1.1.4"
base64 = "0.22"
hex = "0.4"
regex = "1.10"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
